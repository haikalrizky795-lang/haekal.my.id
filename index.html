<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Bio Saya</title>
    <style>
        /* Reset dasar & Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Kartu Profil */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Foto Profil */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }

        /* Nama dan Judul */
        .profile-card h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #222;
        }

        .profile-card p {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        /* Daftar Tautan / Link */
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            padding: 12px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        /* Efek Hover Tautan */
        .link-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Footer singkat */
        .footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Foto Profil (Ganti URL gambar sesuai kebutuhan) -->
        <img src="https://via.placeholder.com/150" alt="Foto Profil" class="profile-img">

        <!-- Nama dan Deskripsi Singkat -->
        <h1>Nama Anda</h1>
        <p>Web Developer & Content Creator | Suka berbagi seputar teknologi.</p>

        <!-- Daftar Link Sosial Media / Portofolio -->
        <div class="links">
            <a href="https://instagram.com" target="_blank" class="link-btn">Instagram</a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn</a>
            <a href="https://github.com" target="_blank" class="link-btn">GitHub / Portofolio</a>
            <a href="mailto:email@example.com" class="link-btn">Hubungi Saya (Email)</a>
        </div>

        <div class="footer">
            &copy; 2026 Nama Anda. All rights reserved.
        </div>
    </div>

</body>
</html>
